services:

  # ── Online serving ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./pipeline:/app/pipeline     # MLflow DB + model artifacts
    environment:
      - MLFLOW_ARTIFACTS_ROOT=/app/pipeline
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Offline batch scoring ─────────────────────────────────────────────────
  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    volumes:
      - ./pipeline:/app/pipeline     # MLflow DB + model artifacts (same as api)
      - ./batch:/app/data            # predictions/ and batch_results.db
    environment:
      - MLFLOW_ARTIFACTS_ROOT=/app/pipeline
      - BATCH_DATA_DIR=/app/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Unified dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    volumes:
      - ./batch:/app/data
    environment:
      - ONLINE_API_URL=http://api:8000
      - BATCH_API_URL=http://batch:8001
      - BATCH_DATA_DIR=/app/data
    ports:
      - "8501:8501"
    depends_on:
      - api
      - batch
