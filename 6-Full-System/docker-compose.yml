services:

  # ── MLflow Tracking Server ────────────────────────────────────────────────
  # The proper production solution.
  # - Artifacts stored in a named volume (not host filesystem)
  # - All services connect via HTTP (no bind mounts, no path remapping)
  # - Works identically on any machine, any VPS
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Online serving ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Offline batch scoring ─────────────────────────────────────────────────
  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    volumes:
      - ./batch:/app/data    # predictions/ and batch_results.db — kept local for analytics
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BATCH_DATA_DIR=/app/data
    ports:
      - "8001:8001"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Unified dashboard ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    volumes:
      - ./batch:/app/data
    environment:
      - ONLINE_API_URL=http://api:8000
      - BATCH_API_URL=http://batch:8001
      - BATCH_DATA_DIR=/app/data
    ports:
      - "8501:8501"
    depends_on:
      - api
      - batch

volumes:
  mlflow_data:    # MLflow DB + all model artifacts — managed by Docker
