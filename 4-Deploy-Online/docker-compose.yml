services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      # Bind-mount the local pipeline directory so the API reads the same
      # MLflow registry the pipeline writes to when run locally.
      - ./pipeline:/app/pipeline
    environment:
      # Remap absolute host artifact paths to the container path at startup.
      # The MLflow SQLite DB stores host-absolute paths; this tells model_loader
      # to replace them with the container-relative path.
      - MLFLOW_ARTIFACTS_ROOT=/app/pipeline
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
